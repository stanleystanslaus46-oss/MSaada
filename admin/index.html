<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSAADA PRO Admin</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f7f9fc;color:#141416;margin:0;padding:24px}.wrap{max-width:620px;margin:auto}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #00184814}h1{color:#001848}label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #d8dee8;font-size:16px}button{background:#001848;color:#fff;font-weight:800;border:0;margin-top:18px;cursor:pointer}.result{margin-top:18px;padding:16px;border-radius:14px;background:#f1f5f9;white-space:pre-wrap}.code{font-size:25px;font-weight:900;letter-spacing:2px;color:#008c95}</style></head>
<body><div class="wrap"><div class="card"><h1>MSAADA PRO Admin</h1><p>Verify the customer's mobile-money payment first. Then create a one-time activation code.</p>
<label>Admin key</label><input id="key" type="password" autocomplete="off">
<label>Customer phone</label><input id="phone" placeholder="07XXXXXXXX">
<label>Transaction ID</label><input id="tx" placeholder="ABC123XYZ">
<label>Plan</label><select id="plan"><option value="monthly">Monthly — TSh 5,000</option><option value="yearly">Yearly — TSh 45,000</option></select>
<button id="create">CREATE ACTIVATION CODE</button><div id="result" class="result" hidden></div></div></div>
<script>
const $=id=>document.getElementById(id); const normalize=p=>{p=p.trim().replace(/[\s()-]/g,'');return p.startsWith('+255')?'255'+p.slice(4):p.startsWith('0')?'255'+p.slice(1):p};
$('create').onclick=async()=>{const key=$('key').value.trim(),phone=normalize($('phone').value),tx=$('tx').value.trim(),plan=$('plan').value;const amount=plan==='yearly'?45000:5000;const r=$('result');r.hidden=false;r.textContent='Creating...';try{const res=await fetch('/api/admin/create-activation',{method:'POST',headers:{'Content-Type':'application/json','X-MSAADA-ADMIN-KEY':key},body:JSON.stringify({customerPhone:phone,transactionId:tx,plan,amount})});const j=await res.json();if(!res.ok)throw new Error(j.message||'Request failed');r.innerHTML='Activation code:\n<span class="code">'+j.code+'</span>\n\nPlan: '+j.plan+'\nExpires: '+new Date(j.expiryTime).toLocaleString()+'\n\nSend this code to the customer. It can be used once.'}catch(e){r.textContent='Error: '+e.message}};
</script></body></html>
